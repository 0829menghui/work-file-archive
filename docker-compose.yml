services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
      SESSION_EXPIRE_HOURS: ${SESSION_EXPIRE_HOURS:-168}
    volumes:
      - ./data:/app/data
    expose:
      - "8010"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8080}:80"
